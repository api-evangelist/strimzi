naftiko: 1.0.0-alpha2
info:
  label: Strimzi Kafka Bridge REST API — Seek
  description: 'Strimzi Kafka Bridge REST API — Seek. 1 operations. Lead operation: Seek to Offset. Self-contained Naftiko
    capability covering one Strimzi business surface.'
  tags:
  - Strimzi
  - Seek
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STRIMZI_API_KEY: STRIMZI_API_KEY
capability:
  consumes:
  - type: http
    namespace: kafka-bridge-seek
    baseUri: http://localhost:8080
    description: Strimzi Kafka Bridge REST API — Seek business capability. Self-contained, no shared references.
    resources:
    - name: consumers-groupid-instances-name-positions
      path: /consumers/{groupid}/instances/{name}/positions
      operations:
      - name: seek
        method: POST
        description: Seek to Offset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupid
          in: path
          type: string
          description: The consumer group ID
          required: true
        - name: name
          in: path
          type: string
          description: The unique name for the consumer instance
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: kafka-bridge-seek-rest
    port: 8080
    description: REST adapter for Strimzi Kafka Bridge REST API — Seek. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/consumers/{groupid}/instances/{name}/positions
      name: consumers-groupid-instances-name-positions
      description: REST surface for consumers-groupid-instances-name-positions.
      operations:
      - method: POST
        name: seek
        description: Seek to Offset
        call: kafka-bridge-seek.seek
        with:
          groupid: rest.groupid
          name: rest.name
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kafka-bridge-seek-mcp
    port: 9090
    transport: http
    description: MCP adapter for Strimzi Kafka Bridge REST API — Seek. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: seek-offset
      description: Seek to Offset
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: kafka-bridge-seek.seek
      with:
        groupid: tools.groupid
        name: tools.name
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
