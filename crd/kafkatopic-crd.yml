apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkatopics.kafka.strimzi.io
  labels:
    app: strimzi
spec:
  group: kafka.strimzi.io
  names:
    kind: KafkaTopic
    listKind: KafkaTopicList
    singular: kafkatopic
    plural: kafkatopics
    shortNames:
      - kt
    categories:
      - strimzi
  scope: Namespaced
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: The specification of the KafkaTopic
              properties:
                partitions:
                  type: integer
                  minimum: 1
                  description: The number of partitions for this topic
                replicas:
                  type: integer
                  minimum: 1
                  description: The replication factor for this topic
                topicName:
                  type: string
                  description: >-
                    The name of the Kafka topic. If not specified, the
                    metadata.name of the KafkaTopic resource is used.
                config:
                  type: object
                  description: >-
                    Topic-level configuration overrides. Supports all Kafka
                    topic configuration options.
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                topicName:
                  type: string
                  description: The actual Kafka topic name
