aid: strimzi
name: Strimzi
description: >-
  Strimzi is a CNCF project providing a Kubernetes-native operator for running Apache Kafka on Kubernetes and OpenShift.
  It simplifies the deployment, management, scaling, and configuration of Kafka clusters using Kubernetes Custom
  Resource Definitions (CRDs). Strimzi manages the full Kafka ecosystem including brokers, ZooKeeper/KRaft, Kafka
  Connect, Kafka MirrorMaker 2, Kafka Bridge, and Schema Registry. The operator pattern lets teams declare desired Kafka
  topology via YAML manifests managed by Kubernetes.
